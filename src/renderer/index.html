<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Cutout Lab</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <label class="btn">Choose file
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp,video/mp4,video/quicktime,video/webm" hidden />
    </label>
    <button id="clear" class="btn">Clear all</button>
    <span id="status">Loading model…</span>
  </header>
  <main>
    <div id="stage" hidden>
      <img id="img" hidden draggable="false" />
      <video id="vid" hidden playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="bar" hidden>
      <button id="back" title="Back 10s">⟲10</button>
      <button id="play" title="Play/Pause">▶</button>
      <button id="fwd" title="Forward 10s">10⟳</button>
      <span class="grow"></span>
      <span id="time">0:00 / 0:00</span>
      <button id="mute" title="Mute (M)">🔊</button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" title="Volume" />
    </div>
    <div id="timeline" hidden>
      <canvas id="ruler"></canvas>
      <canvas id="strip"></canvas>
      <div id="wave"><canvas></canvas><span id="noaudio" hidden>No audio</span></div>
      <div id="playhead"></div>
    </div>
    <p id="hint">Drop an image or video here, or choose a file.</p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
